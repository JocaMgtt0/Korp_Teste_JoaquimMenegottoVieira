server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # try_files com fallback para index.html e obrigatorio em aplicacao de
    # pagina unica com rotas. Sem isso, abrir http://localhost:4200/notas/<id>
    # diretamente ou recarregar a pagina daria 404: o nginx procuraria um
    # arquivo nesse caminho, que nao existe. Quem resolve a rota e o Angular,
    # depois que o index.html carrega.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Os arquivos com hash no nome sao imutaveis, entao podem ser guardados
    # em cache por muito tempo.
    location ~* \.(js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # O index.html nunca entra em cache: e ele que aponta para os bundles
    # novos a cada deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
