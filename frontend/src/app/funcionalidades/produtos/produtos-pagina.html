<header class="cabecalho">
  <div>
    <h1>Produtos</h1>
    <p class="legenda">Catalogo e saldo em estoque</p>
  </div>

  <button mat-flat-button color="primary" (click)="novo()">
    <mat-icon>add</mat-icon>
    Novo produto
  </button>
</header>

<mat-form-field appearance="outline" class="campo-busca">
  <mat-label>Buscar por codigo ou descricao</mat-label>
  <input matInput [formControl]="busca" placeholder="PRD-001 ou teclado" />
  <mat-icon matSuffix>search</mat-icon>
</mat-form-field>

<div class="cartao">
  @if (carregando()) {
    <mat-progress-bar mode="indeterminate" />
  }

  <table mat-table [dataSource]="produtos()">
    <ng-container matColumnDef="codigo">
      <th mat-header-cell *matHeaderCellDef>Codigo</th>
      <td mat-cell *matCellDef="let p"><strong>{{ p.codigo }}</strong></td>
    </ng-container>

    <ng-container matColumnDef="descricao">
      <th mat-header-cell *matHeaderCellDef>Descricao</th>
      <td mat-cell *matCellDef="let p">{{ p.descricao }}</td>
    </ng-container>

    <ng-container matColumnDef="saldo">
      <th mat-header-cell *matHeaderCellDef class="direita">Saldo</th>
      <td mat-cell *matCellDef="let p" class="direita">
        <span class="etiqueta-saldo" [class.zerado]="p.saldo === 0" [class.baixo]="p.saldo > 0 && p.saldo <= 2">
          {{ p.saldo }}
        </span>
      </td>
    </ng-container>

    <ng-container matColumnDef="acoes">
      <th mat-header-cell *matHeaderCellDef class="direita">Acoes</th>
      <td mat-cell *matCellDef="let p" class="direita">
        <button mat-icon-button (click)="editar(p)" matTooltip="Editar">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="excluir(p)"
                matTooltip="Excluir (apenas se nunca usado em nota)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="colunas"></tr>
    <tr mat-row *matRowDef="let linha; columns: colunas"></tr>
  </table>

  @if (!carregando() && produtos().length === 0) {
    <p class="vazio">Nenhum produto encontrado.</p>
  }

  <mat-paginator
    [length]="total()"
    [pageSize]="tamanho"
    [pageIndex]="pagina - 1"
    [pageSizeOptions]="[5, 10, 25, 50]"
    (page)="trocarPagina($event)" />
</div>
