@if (itens.length === 0) {
  <p class="vazio">
    Nenhum produto na nota. Adicione ao menos um item para poder imprimir.
  </p>
} @else {
  <table mat-table [dataSource]="itens" class="tabela-itens">
    <ng-container matColumnDef="codigo">
      <th mat-header-cell *matHeaderCellDef>Codigo</th>
      <td mat-cell *matCellDef="let i"><strong>{{ i.produtoCodigo }}</strong></td>
    </ng-container>

    <ng-container matColumnDef="descricao">
      <th mat-header-cell *matHeaderCellDef>Descricao</th>
      <td mat-cell *matCellDef="let i">{{ i.produtoDescricao }}</td>
    </ng-container>

    <ng-container matColumnDef="quantidade">
      <th mat-header-cell *matHeaderCellDef class="direita">Quantidade</th>
      <td mat-cell *matCellDef="let i" class="direita">{{ i.quantidade }}</td>
    </ng-container>

    <ng-container matColumnDef="acoes">
      <th mat-header-cell *matHeaderCellDef class="direita">Acoes</th>
      <td mat-cell *matCellDef="let i" class="direita">
        <button mat-icon-button (click)="editarQuantidade(i)" matTooltip="Alterar quantidade">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="remover.emit(i)" matTooltip="Remover item">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="colunas"></tr>
    <tr mat-row *matRowDef="let linha; columns: colunas"></tr>
  </table>

  <div class="totais">
    <span>Itens distintos: <strong>{{ totalDeItens }}</strong></span>
    <span>Quantidade total: <strong>{{ quantidadeTotal }}</strong></span>
  </div>
}
